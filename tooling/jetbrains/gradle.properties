# Plugin coordinates. The id is permanent once the plugin is on the Marketplace:
# see "Manual steps for the owner" in README.md before the first upload.
pluginGroup = app.proschi
pluginId = app.proschi
pluginName = Proschi
# Kept in step with tooling/package.json while the plugin is young.
pluginVersion = 0.10.0

# The platform the plugin is compiled and run (runIde) against.
# 2025.3 is the first unified IntelliJ IDEA (one download, free and paid tiers),
# so `intellijIdea(...)` in build.gradle.kts covers both.
platformVersion = 2025.3.6.1
# 253 = 2025.3. The built-in LSP API is declared as the `com.intellij.modules.lsp`
# module from 2025.2.1 and is in every 2025.3 IDE except open-source builds and
# Android Studio. No until-build: new IDE versions stay compatible until the
# verifier says otherwise.
pluginSinceBuild = 253

# Gradle
org.gradle.configuration-cache = true
org.gradle.caching = true
# The IDE ships its own Kotlin standard library; don't bundle a second one.
kotlin.stdlib.default.dependency = false
