openapi: 3.0.3
info:
  title: Orders API
  version: 1.4.0
servers:
  - url: https://api.shop.example/{basePath}
    variables:
      basePath:
        default: v1
paths:
  /orders:
    post:
      summary: Place an order
      requestBody:
        $ref: '#/components/requestBodies/NewOrder'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Problem'
    get:
      summary: List orders
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
  /orders/latest:
    get:
      responses:
        '200':
          description: The most recent order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: integer
    get:
      responses:
        '200':
          description: The order
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Order'
        4XX:
          $ref: '#/components/responses/Problem'
    put:
      requestBody:
        $ref: '#/components/requestBodies/NewOrder'
      responses:
        '204':
          description: Updated
        default:
          $ref: '#/components/responses/Problem'
  /orders/{orderId}/invoice.{format}:
    get:
      responses:
        '200':
          description: The invoice
          content:
            application/pdf: {}
components:
  requestBodies:
    NewOrder:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NewOrder'
  responses:
    Problem:
      description: A problem
      content:
        application/problem+json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
              detail:
                type: string
  schemas:
    NewOrder:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Item'
        note:
          type: string
          nullable: true
    Item:
      type: object
      required: [sku, quantity]
      properties:
        sku:
          type: string
        quantity:
          type: integer
          minimum: 0
          exclusiveMinimum: true
    Order:
      type: object
      required: [id, status]
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [pending, paid, shipped]
        total:
          type: number
          nullable: true
