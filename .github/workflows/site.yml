name: Site

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'backend/**', 'pages-redirect/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['frontend/**', 'backend/**', 'pages-redirect/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether to deploy to Cloudflare: when the CLOUDFLARE_API_TOKEN and
  # CLOUDFLARE_ACCOUNT_ID secrets are set (backend/README.md). Until then
  # GitHub Pages keeps serving the site. A plain output, so later jobs and
  # the log can use it (an expression on secrets would be masked).
  config:
    runs-on: ubuntu-latest
    outputs:
      cloudflare: ${{ steps.check.outputs.cloudflare }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then cloudflare=true; else cloudflare=false; fi
          echo "Deploy to Cloudflare: $cloudflare"
          echo "cloudflare=$cloudflare" >> "$GITHUB_OUTPUT"

  build:
    needs: config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Until the site is on Cloudflare, GitHub Pages serves it, without accounts.
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && needs.config.outputs.cloudflare != 'true'
        with:
          path: frontend/dist

  # Browser tests against `vite preview` of the production build (frontend/e2e).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14

  # The Worker: API tests in workerd with a local D1. It bundles the parser,
  # simulation and practice problems from frontend/src.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # staging.proschi.app, once the repository variable STAGING_ENABLED is
  # 'true' (after its D1 and secrets are set up, backend/README.md): every
  # deploy goes there first and must pass the smoke test before production.
  cloudflare-staging:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.config.outputs.cloudflare == 'true' && vars.STAGING_ENABLED == 'true'
    needs: [config, build, e2e, backend]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.proschi.app/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
        env:
          VITE_ACCOUNTS: 'true'
      - run: npm ci && npm run deploy:staging
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: node scripts/smoke.mjs https://staging.proschi.app
        working-directory: backend

  # proschi.app: builds the site with accounts, backs up and migrates D1 and
  # deploys the Worker that serves both (backend/README.md), once the
  # Cloudflare secrets are set and staging passed (or is not enabled). A
  # broken UI or API must not reach it. `always()` lets it run after a skipped
  # staging job, so the other needs are checked explicitly.
  cloudflare:
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.config.outputs.cloudflare == 'true' && needs.build.result == 'success' && needs.e2e.result == 'success' &&
      needs.backend.result == 'success' && (needs.cloudflare-staging.result == 'success' || needs.cloudflare-staging.result == 'skipped')
    needs: [config, build, e2e, backend, cloudflare-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://proschi.app/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
        env:
          VITE_ACCOUNTS: 'true'
      # npm run backup prints the D1 bookmark before migrating, and sets the step output.
      - id: deploy
        run: npm ci && npm run deploy
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - id: smoke
        run: node scripts/smoke.mjs https://proschi.app
        working-directory: backend
      - if: failure() && steps.smoke.outcome == 'failure'
        env:
          BOOKMARK: ${{ steps.deploy.outputs.bookmark }}
        run: |
          echo "::error::proschi.app failed its smoke test after the deploy. To roll back (backend/README.md):"
          echo "  cd backend && npx wrangler rollback"
          echo "  and, only if the migration broke the data: npx wrangler d1 time-travel restore proschi --bookmark=$BOOKMARK"

  # GitHub Pages (gvart.github.io/proschi/): the site itself until it is on
  # Cloudflare; after that, pages-redirect/, which sends every old URL (with
  # its #code= share fragment) to the same path on proschi.app.
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !cancelled() && (needs.cloudflare.result == 'success' || (needs.cloudflare.result == 'skipped' && needs.config.outputs.cloudflare != 'true' && needs.build.result == 'success' && needs.e2e.result == 'success'))
    needs: [config, build, e2e, cloudflare]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        if: needs.config.outputs.cloudflare == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: needs.config.outputs.cloudflare == 'true'
        with:
          path: pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v5
