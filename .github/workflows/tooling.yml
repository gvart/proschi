name: Tooling

on:
  push:
    branches: [main]
    paths: ['tooling/**', 'frontend/src/dsl/**', 'frontend/src/catalog/**', 'frontend/src/types/**', 'frontend/src/hld/**', 'frontend/src/sim/**', 'frontend/src/utils/**', 'frontend/src/practice/**', 'frontend/src/learn/**', 'frontend/src/game/**', 'frontend/src/playground/**', 'frontend/index.html', 'plugin/**', '.github/workflows/tooling.yml']
  pull_request:
    paths: ['tooling/**', 'frontend/src/dsl/**', 'frontend/src/catalog/**', 'frontend/src/types/**', 'frontend/src/hld/**', 'frontend/src/sim/**', 'frontend/src/utils/**', 'frontend/src/practice/**', 'frontend/src/learn/**', 'frontend/src/game/**', 'frontend/src/playground/**', 'frontend/index.html', 'plugin/**', '.github/workflows/tooling.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tooling
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tooling/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check the committed plugin bundles match their sources
        run: |
          node build.mjs
          if ! git diff --exit-code -- ../plugin/hooks src/terminal/techIcons.gen.ts; then
            echo "::error::plugin/hooks or tooling/src/terminal/techIcons.gen.ts is out of date: run 'node build.mjs' in tooling and commit the result."
            exit 1
          fi
      - name: Check the practice problems
        run: |
          npm run build
          node dist/cli.cjs problem check ../frontend/src/practice/problems
      - name: Check the practice cards
        run: node dist/cli.cjs cards check --format github ../frontend/src/practice/cards
      - name: Check the practice achievements
        run: node dist/cli.cjs achievements check --format github ../frontend/src/practice/achievements.json
      - name: Check the game content
        run: node dist/cli.cjs game check --format github ../frontend/src/game/content
      - run: npm run package:vscode
      - run: npm pack --pack-destination dist
      - uses: actions/upload-artifact@v7
        with:
          name: proschi-tooling
          path: |
            tooling/dist/*.vsix
            tooling/dist/*.tgz
          retention-days: 7
