name: Tooling

on:
  push:
    branches: [main]
    paths: ['tooling/**', 'frontend/src/dsl/**', 'frontend/src/catalog/**', 'frontend/src/types/**', 'frontend/src/services/api.ts', 'frontend/index.html', '.github/workflows/tooling.yml']
  pull_request:
    paths: ['tooling/**', 'frontend/src/dsl/**', 'frontend/src/catalog/**', 'frontend/src/types/**', 'frontend/src/services/api.ts', 'frontend/index.html', '.github/workflows/tooling.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tooling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tooling/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package:vscode
      - run: npm pack --pack-destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: proschi-tooling
          path: |
            tooling/dist/*.vsix
            tooling/dist/*.tgz
