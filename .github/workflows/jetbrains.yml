name: JetBrains plugin

on:
  push:
    branches: [main]
    paths: ['tooling/jetbrains/**', 'tooling/grammar/**', 'tooling/vscode/package.json', 'tooling/vscode/language-configuration.json', '.github/workflows/jetbrains.yml']
    tags: ['jetbrains-v*']
  pull_request:
    paths: ['tooling/jetbrains/**', 'tooling/grammar/**', 'tooling/vscode/package.json', 'tooling/vscode/language-configuration.json', '.github/workflows/jetbrains.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tooling/jetbrains

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The IDE download and the Plugin Verifier's IDEs take several GB.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew buildPlugin
      - name: Test
        run: ./gradlew check
      - name: Verify against the recommended IDEs
        run: ./gradlew verifyPlugin
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jetbrains-test-reports
          path: tooling/jetbrains/build/reports/tests
      - name: Upload Plugin Verifier report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jetbrains-plugin-verifier
          path: tooling/jetbrains/build/reports/pluginVerifier
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: proschi-jetbrains
          path: tooling/jetbrains/build/distributions/*.zip

  # Push a tag `jetbrains-v<pluginVersion>` to sign and publish to the JetBrains
  # Marketplace. Skipped with a notice until the four secrets exist; see
  # tooling/jetbrains/README.md, "Manual steps for the owner".
  publish:
    if: startsWith(github.ref, 'refs/tags/jetbrains-v')
    needs: build
    runs-on: ubuntu-latest
    env:
      PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check the secrets
        id: secrets
        working-directory: .
        run: |
          missing=""
          for name in PUBLISH_TOKEN CERTIFICATE_CHAIN PRIVATE_KEY PRIVATE_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing JETBRAINS_$name"
          done
          if [ -n "$missing" ]; then
            echo "::notice title=JetBrains plugin not published::Missing repository secrets:$missing (see tooling/jetbrains/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v7
      - name: Check the tag matches pluginVersion
        if: steps.secrets.outputs.ready == 'true'
        run: |
          version=$(sed -n 's/^pluginVersion *= *//p' gradle.properties)
          if [ "jetbrains-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pluginVersion $version in tooling/jetbrains/gradle.properties"
            exit 1
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - if: steps.secrets.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Sign and publish
        if: steps.secrets.outputs.ready == 'true'
        run: ./gradlew publishPlugin
