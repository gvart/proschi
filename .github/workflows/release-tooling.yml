name: Release tooling

# Pushing a tag that starts with `tooling-v` (e.g. `tooling-v0.2.0`) publishes
# the `proschi` npm package, attaches the VS Code extension to a GitHub
# release for that tag and publishes the extension to the VS Code Marketplace
# and Open VSX. The tag also pins the GitHub Action (gvart/proschi/action@tooling-v0.2.0),
# which runs the npm package of the same version. Creating the release on github.com with a new tag works
# too (it pushes the tag); the workflow then adds the extension to it.
# Running the workflow by hand on `main` releases the version in
# tooling/package.json and creates the tag and release itself.
#
# Authentication: npm Trusted Publishing (GitHub OIDC). On npmjs.com the
# package's trusted publisher names this repository, this workflow file
# (release-tooling.yml) and the environment `npm`. Trusted Publishing only works
# once the package exists, so the very first release may use an `NPM_TOKEN`
# repository secret instead; delete the secret once Trusted Publishing is set up.
#
# The extension stores need tokens; each step is skipped (with a notice) while
# its secret is missing, so releases work before they are set up:
# - VSCE_PAT: an Azure DevOps personal access token with the Marketplace
#   "Manage" scope (organization "All accessible organizations"), for the
#   publisher `gvart` created at https://marketplace.visualstudio.com/manage.
# - OVSX_PAT: an access token from https://open-vsx.org/user-settings/tokens;
#   once, before the first release, sign the Eclipse publisher agreement there
#   and run `npx ovsx create-namespace gvart -p <token>`.
# Both stores skip a version they already have, so the workflow can be re-run.

on:
  push:
    tags: ['tooling-v*']
  workflow_dispatch:

concurrency:
  group: release-tooling
  cancel-in-progress: false

permissions:
  contents: write # upload the extension to the release
  id-token: write # npm Trusted Publishing

jobs:
  release:
    # A manual run releases what is on main, nothing else.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: tooling
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the release tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="tooling-v$(node -p "require('./package.json').version")"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::error::$tag already exists; bump the version in tooling/package.json first"
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: tooling/package-lock.json
      # Trusted Publishing needs npm 11.5.1 or newer; Node 22 ships with npm 10.
      - run: npm install -g npm@latest
      - name: Check the tag matches both package versions
        run: |
          tag="${VERSION#tooling-v}"
          cli=$(node -p "require('./package.json').version")
          ext=$(node -p "require('./vscode/package.json').version")
          echo "tag=$tag package=$cli extension=$ext"
          test "$tag" = "$cli" && test "$tag" = "$ext"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package:vscode
      # npm tries Trusted Publishing first and falls back to the token, if the secret exists.
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Attach the VS Code extension to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file="dist/proschi-${VERSION#tooling-v}.vsix"
          cp dist/proschi.vsix "$file"
          # Creates the tag too on a manual run.
          gh release view "$VERSION" >/dev/null 2>&1 ||
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "Proschi tooling ${VERSION#tooling-v}" --generate-notes
          gh release upload "$VERSION" "$file" --clobber
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice title=VS Code Marketplace::Skipped: the VSCE_PAT secret is not set"
            exit 0
          fi
          npx @vscode/vsce publish --packagePath dist/proschi.vsix --skip-duplicate -p "$VSCE_PAT"
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice title=Open VSX::Skipped: the OVSX_PAT secret is not set"
            exit 0
          fi
          npx --yes ovsx@1 publish --packagePath dist/proschi.vsix --skip-duplicate -p "$OVSX_PAT"
