name: Release tooling

# Push a tag like `tooling-v0.2.0` to publish the `proschi` npm package and
# attach the VS Code extension to a GitHub release. Publishing uses npm
# Trusted Publishing (GitHub OIDC): no npm token is stored in this repository.
# On npmjs.com the package's trusted publisher must name this repository,
# this workflow file (release-tooling.yml) and the environment `npm`.

on:
  push:
    tags: ['tooling-v*']

permissions:
  contents: write # create the GitHub release
  id-token: write # npm Trusted Publishing

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: tooling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: tooling/package-lock.json
      # Trusted Publishing needs npm 11.5.1 or newer; Node 22 ships with npm 10.
      - run: npm install -g npm@latest
      - name: Check the tag matches both package versions
        run: |
          tag="${GITHUB_REF_NAME#tooling-v}"
          cli=$(node -p "require('./package.json').version")
          ext=$(node -p "require('./vscode/package.json').version")
          echo "tag=$tag package=$cli extension=$ext"
          test "$tag" = "$cli" && test "$tag" = "$ext"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package:vscode
      - run: npm publish --access public
      - name: Create GitHub release with the VS Code extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/proschi.vsix "dist/proschi-${GITHUB_REF_NAME#tooling-v}.vsix"
          gh release create "$GITHUB_REF_NAME" "dist/proschi-${GITHUB_REF_NAME#tooling-v}.vsix" \
            --title "Proschi tooling ${GITHUB_REF_NAME#tooling-v}" --generate-notes
