spring:
  application:
    name: flowdoc-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/flowdoc_dev
    username: flowdoc
    password: flowdoc
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  docker:
    compose:
      enabled: true
      file: compose.yaml

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    com.flowdoc: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO
