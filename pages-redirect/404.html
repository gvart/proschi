<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Proschi has moved to proschi.app</title>
    <link rel="canonical" href="https://proschi.app/" />
    <!-- Without JavaScript: the home page (a share link's #code= needs the script). -->
    <noscript><meta http-equiv="refresh" content="0; url=https://proschi.app/" /></noscript>
    <script>
      // gvart.github.io/proschi/<path>?<query>#<hash> → proschi.app/<path>?<query>#<hash>.
      // GitHub Pages serves this file as 404.html for every other path, so
      // old editor, practice and share links keep working.
      location.replace('https://proschi.app' + location.pathname.replace(/^\/proschi(?=\/|$)/, '') + location.search + location.hash);
    </script>
  </head>
  <body>
    <p>Proschi has moved to <a href="https://proschi.app/">proschi.app</a>.</p>
  </body>
</html>
