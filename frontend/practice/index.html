<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Enforced in builds; inert under `npm run dev` (see .env.production). Styles allow 'unsafe-inline' because CodeMirror
         inserts <style> elements at runtime and a nonce needs per-response headers, which GitHub Pages cannot send; scripts
         stay 'self' only. frame-ancestors cannot be set from a meta tag. -->
    <meta
      http-equiv="%VITE_CSP_HTTP_EQUIV%"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' %VITE_API_ORIGIN%; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="System design practice: design the system in Proschi, and tests in your browser tell you whether it holds up." />
    <title>Practice · Proschi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../src/practice/main.tsx"></script>
  </body>
</html>
