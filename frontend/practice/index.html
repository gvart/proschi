<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Enforced in builds; inert under `npm run dev` (see .env.production). Styles allow 'unsafe-inline' because CodeMirror
         inserts <style> elements at runtime and a nonce needs per-response headers, which GitHub Pages cannot send; scripts
         stay 'self' only. frame-ancestors cannot be set from a meta tag. -->
    <meta
      http-equiv="%VITE_CSP_HTTP_EQUIV%"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFF8E7" />
    <!-- Applies the saved or system theme before first paint. -->
    <script src="../theme-init.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System design practice problems with automatic tests · Proschi</title>
    <meta name="description" content="Free system design interview practice: design a URL shortener, chat, news feed, payments and more, and automatic tests check latency, availability, failures and cost in your browser." />
    <link rel="canonical" href="https://proschi.app/practice/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Proschi" />
    <meta property="og:title" content="System design practice problems with automatic tests" />
    <meta property="og:description" content="Free system design interview practice: design a URL shortener, chat, news feed, payments and more, and automatic tests check latency, availability, failures and cost in your browser." />
    <meta property="og:url" content="https://proschi.app/practice/" />
    <meta property="og:image" content="https://proschi.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../src/practice/main.tsx"></script>
  </body>
</html>
