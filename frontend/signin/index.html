<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Enforced in builds; inert under `npm run dev` (see .env.production). Cloudflare Turnstile (src/auth/Turnstile.tsx)
         loads its script from challenges.cloudflare.com and draws its check in a frame from there. -->
    <meta
      http-equiv="%VITE_CSP_HTTP_EQUIV%"
      content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <!-- The email links' token is in the hash, never sent anywhere; no-referrer all the same. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFF8E7" />
    <!-- Applies the saved or system theme before first paint. -->
    <script src="../theme-init.js"></script>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · Proschi</title>
    <meta name="description" content="Sign in to Proschi with your email address, GitHub or Google." />
  </head>
  <body>
    <div id="root"></div>
    <noscript><p>Signing in needs JavaScript.</p></noscript>
    <script type="module" src="../src/auth/main.tsx"></script>
  </body>
</html>
