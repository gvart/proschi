<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Served for any missing path, at any depth (backend/wrangler.jsonc, not_found_handling), so every relative URL on
         this page resolves from the site root. -->
    <base href="/" />
    <!-- Enforced in builds; inert under `npm run dev` (see .env.production). frame-ancestors cannot be set from a meta tag. -->
    <meta
      http-equiv="%VITE_CSP_HTTP_EQUIV%"
      content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFF8E7" />
    <meta name="robots" content="noindex" />
    <!-- Applies the saved or system theme before first paint. -->
    <script src="./theme-init.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found · Proschi</title>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>

    <!--shell:header-->

    <main id="main" class="not-found">
      <div class="ps-wrap not-found__inner">
        <p class="not-found__code" aria-hidden="true">404</p>
        <h1>This page does not exist.</h1>
        <p>The link may be old, or mistyped. These are a good place to start:</p>
        <p class="not-found__links">
          <a class="ps-btn ps-btn--primary" href="./app/">Open the editor</a>
          <a class="ps-btn ps-btn--secondary" href="./practice/">Practice problems</a>
          <a class="ps-btn ps-btn--secondary" href="./docs/">Docs</a>
        </p>
      </div>
    </main>

    <!--shell:footer-->

    <script type="module" src="/src/notFound/main.ts"></script>
  </body>
</html>
